<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 494" width="960" height="494"><rect width="960" height="494" fill="#fff"/><g font-family="Arial,sans-serif" fill="#25332e"><text x="480" y="35" font-size="23" font-weight="bold" text-anchor="middle">Six selected classifiers vs weighted voting</text><text x="480" y="58" font-size="14" text-anchor="middle">UCI HAR | 7,352 train / 2,947 test | 561 features</text><line x1="255" y1="78" x2="255" y2="448" stroke="#e0e5e1"/><text x="255" y="466" font-size="12" text-anchor="middle">0%</text><line x1="407.5" y1="78" x2="407.5" y2="448" stroke="#e0e5e1"/><text x="407.5" y="466" font-size="12" text-anchor="middle">25%</text><line x1="560" y1="78" x2="560" y2="448" stroke="#e0e5e1"/><text x="560" y="466" font-size="12" text-anchor="middle">50%</text><line x1="712.5" y1="78" x2="712.5" y2="448" stroke="#e0e5e1"/><text x="712.5" y="466" font-size="12" text-anchor="middle">75%</text><line x1="865" y1="78" x2="865" y2="448" stroke="#e0e5e1"/><text x="865" y="466" font-size="12" text-anchor="middle">100%</text><text x="243" y="101" text-anchor="end" font-size="14">Weighted Soft Voting</text><rect x="255" y="83" width="584.747200542925" height="27" rx="4" fill="#25805a"/><text x="847.747200542925" y="101" font-size="14" font-weight="bold">95.86%</text><text x="243" y="145" text-anchor="end" font-size="14">Logistic Regression</text><rect x="255" y="127" width="582.6772989480828" height="27" rx="4" fill="#426b94"/><text x="845.6772989480828" y="145" font-size="14" font-weight="bold">95.52%</text><text x="243" y="189" text-anchor="end" font-size="14">SVM (RBF Kernel)</text><rect x="255" y="171" width="582.4703087885986" height="27" rx="4" fill="#426b94"/><text x="845.4703087885986" y="189" font-size="14" font-weight="bold">95.49%</text><text x="243" y="233" text-anchor="end" font-size="14">Weighted Hard Voting</text><rect x="255" y="215" width="579.9864268747879" height="27" rx="4" fill="#25805a"/><text x="842.9864268747879" y="23